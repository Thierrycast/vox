[package]
name = "vox"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Ditado e leitura por voz, sobre a speech-api do lab"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"

# audio
cpal = "0.15"
rodio = { version = "0.19", default-features = false, features = ["wav"] }

# rede
reqwest = { version = "0.12", default-features = false, features = [
  "json", "multipart", "native-tls", "stream", "gzip",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
# WebSocket para a transcrição incremental. `native-tls` para acompanhar o
# reqwest: dois back-ends de TLS no mesmo binário dobrariam o tamanho e as
# superfícies de configuração.
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# dados
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# integração com o Windows
arboard = "3"
enigo = "0.2"   # no Windows usa o backend win32 (SendInput) por padrão

[target.'cfg(windows)'.dependencies]
# ID estável de microfone via WASAPI — ver `src/mic_id.rs`. Mesma versão que o
# `cpal` já traz consigo, pra não duplicar a árvore de dependências.
windows = { version = "0.54", features = [
  "Win32_Media_Audio",
  "Win32_Foundation",
  "Win32_Devices_Properties",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
] }

# utilidades
anyhow = "1"
thiserror = "2"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# O HUD precisa aparecer instantaneamente; vale o tempo de build.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
